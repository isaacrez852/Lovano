workflows:
  android-workflow:
    name: Lovano - Android
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
    scripts:
      - name: Installer les dépendances
        script: npm install
      - name: Ajouter la plateforme Android
        script: npx cap add android || true
      - name: Cibler l'API Android 36 (exigence Google Play) et gérer les marges système
        script: |
          perl -pi -e 's/compileSdkVersion = \d+/compileSdkVersion = 36/; s/targetSdkVersion = \d+/targetSdkVersion = 36/' android/variables.gradle
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          cat android/variables.gradle
          cat > android/app/src/main/java/com/lovano/app/MainActivity.java <<'EOF'
          package com.lovano.app;

          import android.os.Bundle;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  View content = findViewById(android.R.id.content);
                  content.setBackgroundColor(0xFF1B2A4A);
                  ViewCompat.setOnApplyWindowInsetsListener(content, (v, windowInsets) -> {
                      Insets bars = windowInsets.getInsets(
                          WindowInsetsCompat.Type.systemBars()
                          | WindowInsetsCompat.Type.displayCutout()
                          | WindowInsetsCompat.Type.ime());
                      v.setPadding(bars.left, bars.top, bars.right, bars.bottom);
                      return WindowInsetsCompat.CONSUMED;
                  });
              }
          }
          EOF
      - name: Générer l'icône et l'écran de démarrage
        script: npx @capacitor/assets generate --android
      - name: Synchroniser le code web
        script: npx cap sync android
      - name: Construire l'APK (debug, test rapide)
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  android-release-workflow:
    name: Lovano - Android (Release Play Store)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
      groups:
        - lovano_signing
    scripts:
      - name: Installer les dépendances
        script: npm install
      - name: Ajouter la plateforme Android
        script: npx cap add android || true
      - name: Cibler l'API Android 36 (exigence Google Play) et gérer les marges système
        script: |
          perl -pi -e 's/compileSdkVersion = \d+/compileSdkVersion = 36/; s/targetSdkVersion = \d+/targetSdkVersion = 36/' android/variables.gradle
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          cat android/variables.gradle
          cat > android/app/src/main/java/com/lovano/app/MainActivity.java <<'EOF'
          package com.lovano.app;

          import android.os.Bundle;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  View content = findViewById(android.R.id.content);
                  content.setBackgroundColor(0xFF1B2A4A);
                  ViewCompat.setOnApplyWindowInsetsListener(content, (v, windowInsets) -> {
                      Insets bars = windowInsets.getInsets(
                          WindowInsetsCompat.Type.systemBars()
                          | WindowInsetsCompat.Type.displayCutout()
                          | WindowInsetsCompat.Type.ime());
                      v.setPadding(bars.left, bars.top, bars.right, bars.bottom);
                      return WindowInsetsCompat.CONSUMED;
                  });
              }
          }
          EOF
      - name: Générer l'icône et l'écran de démarrage
        script: npx @capacitor/assets generate --android
      - name: Synchroniser le code web
        script: npx cap sync android
      - name: Préparer la clé de signature
        script: |
          echo "Longueur de CM_KEYSTORE recue : $(printf '%s' "$CM_KEYSTORE" | wc -c) caracteres (attendu ~3444)"
          printf '%s' "$CM_KEYSTORE" | tr -d '[:space:]' | base64 -D > android/app/lovano-release.keystore
          echo "Taille du fichier keystore genere : $(wc -c < android/app/lovano-release.keystore) octets (attendu 2583)"
          keytool -list -keystore android/app/lovano-release.keystore -storepass "$CM_KEYSTORE_PASSWORD" -alias "$CM_KEY_ALIAS"
      - name: Configurer la signature Android (release)
        script: |
          cat >> android/app/build.gradle <<'EOF'

          android.signingConfigs {
              release {
                  storeFile file("lovano-release.keystore")
                  storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("CM_KEY_ALIAS")
                  keyPassword System.getenv("CM_KEY_PASSWORD")
              }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          EOF
      - name: Construire l'AAB signé (pour le Play Store)
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab

  ios-workflow:
    name: Lovano - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Installer les dépendances
        script: npm install
      - name: Ajouter la plateforme iOS
        script: npx cap add ios || true
      - name: Générer l'icône et l'écran de démarrage
        script: npx @capacitor/assets generate --ios
      - name: Synchroniser le code web
        script: npx cap sync ios
      - name: Installer les pods iOS
        script: |
          cd ios/App
          pod install
    artifacts:
      - ios/App/build/**/*.ipa
